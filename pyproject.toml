[project]
name = "zeointegrations-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff==0.15.5"]

[tool.uv]
package = false
required-version = ">=0.12.2"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
