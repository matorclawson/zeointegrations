[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zeo-integrations"
version = "0.1.0"
description = "Zeo integration collection; provider SDKs are optional"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["zeocore>=0.43.0,<1", "httpx>=0.28.1,<1", "pydantic>=2.13.4,<3"]

[project.optional-dependencies]
github = ["requests"]
google = ["google-api-python-client>=2", "google-auth-httplib2>=0.1", "google-auth-oauthlib>=0.4", "platformdirs>=4"]
gmail = ["zeo-integrations[google]"]
drive = ["zeo-integrations[google]"]
calendar = ["zeo-integrations[google]"]
docs = ["zeo-integrations[google]"]
sheets = ["zeo-integrations[google]"]
slides = ["zeo-integrations[google]"]
youtube = ["zeo-integrations[google]", "requests"]
notion = ["notion-client>=3.1.0"]
supabase = ["supabase>=2.31.0,<3"]
bluesky = ["requests", "platformdirs>=4"]
revolut = ["cryptography>=45", "platformdirs>=4"]
jupytext = ["jupytext>=1.16", "nbformat>=5.10"]
ffmpeg = ["ffmpeg-zeo>=0.1"]
pandoc = ["pypandoc", "beautifulsoup4"]
llms = ["tiktoken", "openai", "anthropic"]

[dependency-groups]
dev = ["ruff==0.15.5", "pytest>=7", "pytest-asyncio>=0.21", "hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeo_integrations"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "zeo_integrations/NOTICE"

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml", "README.md", "LICENSE", "NOTICE"]

[tool.uv]
required-version = ">=0.12.2"
constraint-dependencies = ["certifi==2026.7.22", "idna==3.19"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve upstream annotation/generic/enum semantics during pure provider moves.
"src/zeo_integrations/google/drive/utils/api.py" = ["UP047"]
"src/zeo_integrations/google/mail/utils/api.py" = ["UP047"]
"tests/test_integrations/google/mail/mocks.py" = ["UP047"]
"src/zeo_integrations/llms/models.py" = ["UP042"]
"src/zeo_integrations/supabase/auth.py" = ["UP037"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Cell is missing an id field",
]
markers = [
    "integration: integration tests (synthetic doubles; no live providers)",
    "slow: longer tests",
    "e2e: end-to-end fixture workflows",
    "unit: unit tests",
    "smoke: smoke tests",
]
