name: Publish reviewed HubSpot wheel

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-hubspot-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zeroemployeeorg/zeointegrations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/zeo-integration-hubspot/0.1.0/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the immutable reviewed release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 966aac8f7fa0832f50ecfdd98d7856356ab998fb
          persist-credentials: false
      - name: Verify and stage only the approved wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import zipfile
          from email.parser import BytesParser

          release = pathlib.Path("releases/hubspot/0.1.0")
          name = "zeo_integration_hubspot-0.1.0-py3-none-any.whl"
          expected = "5225a18818d84d48f7d5df94c0d3b7d6c87856bdfb11ad10de20bbe1932e16d8"
          wheel = release / name
          data = wheel.read_bytes()
          record = json.loads((release / "release.json").read_text())
          assert len(data) == 22004
          assert hashlib.sha256(data).hexdigest() == expected
          assert record["artifact"] == {"file": name, "bytes": 22004, "sha256": expected}
          assert record["distribution"] == "zeo-integration-hubspot"
          assert record["version"] == "0.1.0"
          assert record["source"]["commit"] == "6432173891eca78c673c592a422e37ab9c089578"
          with zipfile.ZipFile(wheel) as archive:
              metadata = BytesParser().parsebytes(archive.read(
                  "zeo_integration_hubspot-0.1.0.dist-info/METADATA"))
          assert metadata["Name"] == "zeo-integration-hubspot"
          assert metadata["Version"] == "0.1.0"
          target = pathlib.Path("publish-dist")
          target.mkdir()  # Refuse stale output; never upload a broad artifact directory.
          shutil.copyfile(wheel, target / name)
          print(f"Verified {name}: {len(data)} bytes sha256={expected}")
          PY
      - name: Publish with the operator-configured PyPI trusted publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
          skip-existing: false
          attestations: true
