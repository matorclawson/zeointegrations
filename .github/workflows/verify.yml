name: verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/python:3.14.3-bookworm@sha256:647fc2dbb7df74521c75aac3f21668234b7e91433bda558abcf2547ee84c3ad3
    timeout-minutes: 10
    env:
      UV_PYTHON: /usr/local/bin/python3.14
      UV_PYTHON_DOWNLOADS: never
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Acquire checksum-verified uv into a new private directory
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          tool_directory="$RUNNER_TEMP/zeointegrations-uv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          /usr/local/bin/python3.14 tools/acquire_uv.py --directory "$tool_directory" \
            --source-head "$SOURCE_HEAD" --checkout-head "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"
      - name: Record execution environment
        run: |
          /usr/local/bin/python3.14 --version
          uv --version
          printf 'runner image: %s %s\n' "$ImageOS" "$ImageVersion"
      - run: make verify
