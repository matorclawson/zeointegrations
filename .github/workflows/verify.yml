name: smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    container:
      image: docker.io/library/python:3.14.3-bookworm@sha256:647fc2dbb7df74521c75aac3f21668234b7e91433bda558abcf2547ee84c3ad3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependency-free skeleton smoke
        run: |
          /usr/local/bin/python3.14 -m compileall -q tools tests
          /usr/local/bin/python3.14 -m unittest discover -s tests -v
