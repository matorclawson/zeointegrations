name: Check integration artifacts on merge

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-integrations
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zeroemployeeorg/zeointegrations'
    # Architect17:25 packaging-only hosted exception; full gates remain on ENG.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_CONCURRENT_BUILDS: '1'
      UV_CONCURRENT_INSTALLS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.2'
      - name: Install the frozen release toolchain
        run: uv sync --frozen --only-group release
      - name: Build twice offline and compare exact bytes
        id: artifacts
        run: uv run --frozen --no-sync python tools/release_integrations.py build --destination "$RUNNER_TEMP/aggregate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Import smoke from the installed built wheel
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev --no-install-project
          uv pip install --python .venv/bin/python --no-deps "$RUNNER_TEMP/aggregate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/dist/"*.whl
          wheel_python="$PWD/.venv/bin/python"
          cd "$RUNNER_TEMP"
          "$wheel_python" -I -c 'import json, sys, zeo_integrations; from importlib.metadata import distribution; d = distribution("zeo-integrations"); assert any(str(p).startswith("zeo_integrations/") for p in d.files); assert d.version == json.load(open(sys.argv[1]))["version"]; print(d.metadata["Name"], d.version)' "$RUNNER_TEMP/aggregate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/release-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 90
