[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zeo-integration-loops"
version = "0.1.0"
description = "Typed draft-only Loops API client with injected credentials"
requires-python = ">=3.14"
license = "MIT"
readme = "README.md"
dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.13.4,<3"]

[dependency-groups]
dev = ["ruff==0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeo_integrations"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
# Match the receiving Broker lock rather than a newly published transitive release.
constraint-dependencies = ["certifi==2026.7.22", "idna==3.19"]
